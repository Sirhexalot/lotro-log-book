<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reise – LOTRO Log Book</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="gemeinsam.css">
<link rel="stylesheet" href="reise.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});
var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';
j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-TRC8BF95');
</script>
</head>
<body data-seite="reise" class="seite-text">

<header class="kopf">
	<div class="kopf-innen">
		<h1 data-t="produkt">LOTRO Log Book</h1>
		<nav class="menue" id="menue" aria-label="Menü"></nav>
		<nav class="sprachen" aria-label="Sprache">
			<button type="button" data-lang="de" aria-pressed="true">DE</button>
			<button type="button" data-lang="en" aria-pressed="false">EN</button>
			<button type="button" data-lang="fr" aria-pressed="false">FR</button>
		</nav>
	</div>
</header>

<main class="seite reise" id="reise">
	<aside class="reise-panel">
		<h2 data-t="reise_titel">Reise</h2>
		<p class="reise-einleitung" data-t="reise_einleitung"></p>

		<form class="reise-formular" id="reise-formular" autocomplete="off">
			<div class="reise-feld reise-feld-von">
				<span class="reise-marke" aria-hidden="true"></span>
				<label for="reise-von" data-t="reise_von">Wo bin ich?</label>
				<input id="reise-von" type="text" data-t-ph="reise_von_platz"
					aria-autocomplete="list" aria-controls="reise-von-liste" aria-expanded="false">
				<ul class="reise-vorschlaege" id="reise-von-liste" role="listbox" hidden></ul>
			</div>
			<button type="button" class="reise-tausch" id="reise-tauschen" aria-label="Start und Ziel tauschen">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
					stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M7 4v13"/><path d="m4 14 3 3 3-3"/><path d="M17 20V7"/><path d="m14 10 3-3 3 3"/>
				</svg>
			</button>
			<div class="reise-feld reise-feld-nach">
				<span class="reise-marke reise-marke-ziel" aria-hidden="true"></span>
				<label for="reise-nach" data-t="reise_nach">Wohin?</label>
				<input id="reise-nach" type="text" data-t-ph="reise_nach_platz"
					aria-autocomplete="list" aria-controls="reise-nach-liste" aria-expanded="false">
				<ul class="reise-vorschlaege" id="reise-nach-liste" role="listbox" hidden></ul>
			</div>
			<button type="submit" class="reise-knopf" data-t="reise_knopf">Weg zeigen</button>
		</form>

		<p class="reise-hilfe" data-t-html="reise_von_hilfe"></p>
		<p class="reise-zeile">
			<button type="button" class="reise-leise" id="reise-beispiel" data-t="reise_beispiel_knopf">Beispiel laden</button>
		</p>

		<section id="reise-ergebnis" class="reise-ergebnis" aria-live="polite"></section>

		<details class="reise-skills" id="reise-skills">
			<summary data-t="reise_klasse">Reisefertigkeiten deiner Klasse</summary>
			<p class="reise-hilfe" data-t="reise_klasse_hinweis"></p>
			<label for="reise-klasse" data-t="reise_klasse_waehlen">Klasse</label>
			<select id="reise-klasse" class="reise-klasse"></select>
			<ul class="reise-ports" id="reise-ports"></ul>
		</details>
	</aside>

	<div class="reise-buehne" id="reise-buehne">
		<img class="reise-welt" id="reise-welt" alt="" decoding="async">
		<p class="reise-welt-hinweis" id="reise-welt-hinweis" data-t="reise_welt_hinweis"></p>
		<div class="reise-karten" id="reise-karten" hidden></div>
	</div>
</main>

<script src="texte.js"></script>
<script src="texte-spielstand.js"></script>
<script src="texte-logbuch.js"></script>
<script src="texte-site.js"></script>
<script src="texte-reise.js"></script>
<script src="sprache.js"></script>
<script src="speicher.js"></script>
<script src="menue.js"></script>
<script src="reise.js"></script>
</body>
</html>
