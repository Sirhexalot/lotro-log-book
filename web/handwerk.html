<meta charset="utf-8">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="gemeinsam.css">
<link rel="stylesheet" href="handwerk.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});
var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';

<body data-seite="handwerk" class="seite-text">

<header class="kopf">
	<div class="kopf-innen">
		<h1 data-t="produkt">LOTRO Log Book</h1>
		<nav class="menue" id="menue" aria-label="Menü"></nav>
		<nav class="sprachen" aria-label="Sprache">
			<button type="button" data-lang="de" aria-pressed="true">DE</button>
			<button type="button" data-lang="en" aria-pressed="false">EN</button>
			<button type="button" data-lang="fr" aria-pressed="false">FR</button>
		</nav>
	</div>
</header>

<main class="seite handwerk-seite">
	<h2 data-t="hw_titel">Handwerk</h2>
	<div class="reiter" role="tablist" id="hw-reiter">
		<button type="button" data-hw="berufe" aria-pressed="true" data-t="hw_berufe">Berufe</button>
		<button type="button" data-hw="rezepte" aria-pressed="false" data-t="hw_rezepte">Rezepte</button>
		<button type="button" data-hw="rohstoffe" aria-pressed="false" data-t="hw_rohstoffe">Rohstoffe</button>
	</div>
	<p class="handwerk-einleitung" id="hw-einleitung" data-t="hw_text"></p>

	<section id="hw-berufe">
		<p class="meldung" id="hinweis"></p>
		<div id="berufe"></div>
	</section>

	<section id="hw-rezepte" hidden>
		<span id="rezepte" class="handwerk-anker" aria-hidden="true"></span>
		<p class="schwach" data-t="hw_rezepte_hinweis">Mit importiertem Spielstand zeigt jede Zeile, ob dein Charakter das Rezept schon kennt.</p>
		<div id="rezepte-liste"></div>
	</section>

	<section id="hw-rohstoffe" hidden>
		<span id="rohstoffe" class="handwerk-anker" aria-hidden="true"></span>
		<p class="schwach" data-t="hw_rohstoffe_hinweis">Zahlen sind Fundstellen aus den Spieldaten. Ein Fleck kann mehrere Vorkommen tragen; welches gerade dort steht, wechselt im Spiel.</p>
		<div id="rohstoffe-liste"></div>
	</section>
</main>

<script src="rohstoffe.js"></script>

</body>
</html>
